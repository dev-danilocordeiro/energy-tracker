spring:
  application:
    name: ingestion-service
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers:
      - localhost:9092
    template:
      default-topic: energy-usage
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
server:
  port: 8083


simulation:
  endpoint: http://localhost:8083/api/v1/ingestion
  requests-per-interval: 1000
  interval-ms: 5000
  parallel-threads: 10

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    # Buckets are what p95/p99 queries need, and where Micrometer attaches trace exemplars
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Traces and logs go to Tempo and Loki over OTLP; metrics stay on Prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGS_ENDPOINT:http://localhost:3100/otlp/v1/logs}
  otlp:
    metrics:
      export:
        enabled: false
