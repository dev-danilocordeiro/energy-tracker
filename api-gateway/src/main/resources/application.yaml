server:
  port: 9000
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8091/realms/het-security-realm
management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: ALWAYS
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - circuitbreakers
          - prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    # Buckets are what p95/p99 queries need, and where Micrometer attaches trace exemplars
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Traces and logs go to Tempo and Loki over OTLP; metrics stay on Prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGS_ENDPOINT:http://localhost:3100/otlp/v1/logs}
  otlp:
    metrics:
      export:
        enabled: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 8
        failureRateThreshold: 20
        minimum-number-of-calls: 4
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      deviceServiceCircuitBreaker:
        baseConfig: default
      ingestionServiceCircuitBreaker:
        baseConfig: default
      usageServiceCircuitBreaker:
        baseConfig: default
      insightServiceCircuitBreaker:
        baseConfig: default
  timelimiter:
    instances:
      insightServiceCircuitBreaker:
        timeoutDuration: 120s

# Token buckets per client (JWT subject), shared by every gateway instance through Redis.
# Burst up to `capacity`, then `refill-tokens` per `refill-period`.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    # Every limited request waits on Redis, so a slow Redis must fail fast (and fail open)
    timeout: 200ms
  policies:
    # user, device, ingestion, usage: 50 req/s sustained per client, bursts of 100
    default:
      capacity: ${RATE_LIMIT_DEFAULT_CAPACITY:100}
      refill-tokens: ${RATE_LIMIT_DEFAULT_REFILL:50}
      refill-period: 1s
    # Each miss is an Ollama call that takes seconds: 10 per minute per client
    insight:
      capacity: ${RATE_LIMIT_INSIGHT_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_INSIGHT_REFILL:10}
      refill-period: 1m

keycloak:
  auth:
    jwk-set-uri: http://localhost:8091/realms/het-security-realm/protocol/openid-connect/certs


security:
  excluded:
    urls: /actuator/**,/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**,/aggregate/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /aggregate/user-service/v3/api-docs
      - name: Device Service
        url: /aggregate/device-service/v3/api-docs
      - name: Ingestion Service
        url: /aggregate/ingestion-service/v3/api-docs
      - name: Usage Service
        url: /aggregate/usage-service/v3/api-docs
      - name: Insight Service
        url: /aggregate/insight-service/v3/api-docs
