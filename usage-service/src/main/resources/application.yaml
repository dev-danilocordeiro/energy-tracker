server:
  port: 8084
spring:
  application:
    name: usage-service
  kafka:
    template:
      default-topic: energy-alerts
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    bootstrap-servers:
      - localhost:9092
    consumer:
      group-id: usage-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            type:
              mapping: energyUsageEvent:com.devcordeiro.kafka.event.EnergyUsageEvent

influx:
  url: http://localhost:8072
  token: my-token
  org: energy-tracker
  bucket: usage-bucket

device:
  service:
    url: http://localhost:8082/api/v1/device


user:
  service:
    url: http://localhost:8081/api/v1/user

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    # Buckets are what p95/p99 queries need, and where Micrometer attaches trace exemplars
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Traces and logs go to Tempo and Loki over OTLP; metrics stay on Prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGS_ENDPOINT:http://localhost:3100/otlp/v1/logs}
  otlp:
    metrics:
      export:
        enabled: false
