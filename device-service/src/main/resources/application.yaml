spring:
  application:
    name: device-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:energy_tracker}
    username: ${MYSQL_USER:energy}
    password: ${MYSQL_PASSWORD:energy}

server:
  port: 8082

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
